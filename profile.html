<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moi - Maholy-Dev</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-color: #030014; --accent-color: #7c3aed; --secondary-color: #3b82f6; --text-color: #ffffff; --card-bg: rgba(255, 255, 255, 0.03); }
        body.light-mode { --bg-color: #ffffff; --accent-color: #6d28d9; --secondary-color: #2563eb; --text-color: #1f2937; --card-bg: rgba(0, 0, 0, 0.05); }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Poppins', sans-serif; background: var(--bg-color); color: var(--text-color); overflow-x: hidden; display: flex; justify-content: center; padding-bottom: 70px; padding-top: 60px; }
        body::before, body::after { content: ""; position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.3; animation: meshMove 20s infinite alternate; }
        body::before { background: var(--accent-color); top: -50px; left: -50px; }
        body::after { background: var(--secondary-color); bottom: 50px; right: -50px; animation-delay: -10s; }
        @keyframes meshMove { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }

        header, .bottom-nav { position: fixed; width: 100%; max-width: 500px; left: 50%; transform: translateX(-50%); z-index: 1000; }
        header { top: 0; height: 60px; background: rgba(3, 0, 20, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; border-bottom: 1px solid var(--accent-color); }
        .bottom-nav { bottom: 0; height: 65px; background: rgba(3, 0, 20, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--accent-color); }
        .nav-item { text-decoration: none; color: rgba(255,255,255,0.5); text-align: center; font-size: 0.7rem; transition: 0.3s; }
        .nav-item i { font-size: 1.2rem; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent-color); }
        #clock { font-family: 'Orbitron', sans-serif; color: var(--accent-color); font-size: 0.9rem; }
        
        .container { padding: 40px 20px; width: 100%; max-width: 500px; text-align: center; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; background: url('IMAGE.jpg') center/cover; margin: 0 auto 20px; border: 3px solid var(--accent-color); box-shadow: 0 0 20px var(--accent-color); }
        .logout-btn { width: 100%; padding: 14px; margin-top: 30px; background: linear-gradient(90deg, #ff4b2b, #ff416c); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .logout-btn:hover { opacity: 0.8; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4); }

        [data-lang="mg"] { display: none; }
        body.lang-mg [data-lang="fr"] { display: none; }
        body.lang-mg [data-lang="mg"] { display: inline; }
    </style>
</head>
<body class="dark-mode">
    <header>
        <div id="clock">00:00:00</div>
        <div style="display: flex; gap: 10px;">
            <button onclick="toggleLang('fr')" style="background:none; border:1px solid var(--accent-color); color:white; cursor:pointer; padding: 2px 8px; border-radius: 4px;">FR</button>
            <button onclick="toggleLang('mg')" style="background:none; border:1px solid var(--accent-color); color:white; cursor:pointer; padding: 2px 8px; border-radius: 4px;">MG</button>
        </div>
    </header>

    <div class="container">
        <div class="profile-img"></div>
        <h2 id="prof-name" style="font-family: 'Orbitron'; margin-bottom: 5px;">...</h2>
        <p id="prof-email" style="opacity: 0.6; margin-bottom: 20px;"></p>
        
        <div style="background: var(--card-bg); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); text-align: left;">
            <p><strong>Status:</strong> <span data-lang="fr">En ligne</span><span data-lang="mg">Mandeha</span></p>
            <p><strong>Role:</strong> Développeur</p>
        </div>

        <button id="logoutBtn" class="logout-btn">
            <span data-lang="fr">Déconnexion</span><span data-lang="mg">Hivoaka</span>
        </button>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span data-lang="fr">Accueil</span><span data-lang="mg">Fandraisana</span>
        </a>
        <a href="projets.html" class="nav-item">
            <i class="fas fa-code"></i>
            <span data-lang="fr">Projets</span><span data-lang="mg">Tetikasa</span>
        </a>
        <a href="about.html" class="nav-item">
            <i class="fas fa-info-circle"></i>
            <span data-lang="fr">À propos</span><span data-lang="mg">Momba</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <div style="width:20px; height:20px; border-radius:50%; background:url('IMAGE.jpg') center/cover; margin: 0 auto 4px; border: 1px solid var(--accent-color);"></div>
            <span data-lang="fr">Moi</span><span data-lang="mg">Izaho</span>
        </a>
    </nav>

    <script type="module">
        import { getUser, signOutUser } from './auth.js';
        const user = await getUser();
        if (!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('prof-email').innerText = user.email;
            document.getElementById('prof-name').innerText = user.user_metadata?.full_name || 'Utilisateur';
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOutUser();
            window.location.href = 'login.html';
        });
    </script>

    <script>
        function updateTime() {
            const options = { timeZone: 'Indian/Antananarivo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            document.getElementById('clock').innerHTML = new Date().toLocaleTimeString('fr-FR', options);
        }
        setInterval(updateTime, 1000); updateTime();

        function toggleLang(lang) {
            if(lang === 'mg') document.body.classList.add('lang-mg');
            else document.body.classList.remove('lang-mg');
            localStorage.setItem('lang', lang);
        }
        if(localStorage.getItem('lang') === 'mg') toggleLang('mg');
    </script>
</body>
</html>
